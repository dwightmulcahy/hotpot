[[rule]]
name = "environment-files"
action = "tarpit"
paths = ["/.env", "/.env.local", "/.env.production", "/config.php", "/configuration.php"]
category = "secret-discovery"
status = 403
response = "Forbidden"

[[rule]]
name = "credential-directories"
action = "deceive"
path_prefixes = ["/.aws/", "/.ssh/"]
category = "credential-discovery"
status = 404
response = "Not Found"
