[[rule]]
name = "docker-ping"
action = "deceive"
paths = ["/_ping"]
methods = ["GET", "HEAD"]
category = "container-admin-discovery"
bait_id = "docker-api"
bait_stage = "discovered"
status = 200
content_type = "text/plain; charset=utf-8"
response = "OK"

[[rule]]
name = "docker-api-discovery"
action = "tarpit"
regex = ["^/(v[0-9]+\\.[0-9]+/)?(containers/json|images/json|networks|volumes|info)(/|$)"]
methods = ["GET", "HEAD"]
category = "container-admin-discovery"
bait_id = "docker-api"
bait_stage = "interacted"
status = 200
content_type = "application/json; charset=utf-8"
response = "[]"

[[rule]]
name = "docker-container-actions"
action = "tarpit"
regex = ["^/(v[0-9]+\\.[0-9]+/)?containers/[^/]+/(exec|start|stop|kill|archive)(/|$)"]
methods = ["POST", "PUT", "PATCH", "DELETE"]
category = "container-rce-probe"
bait_id = "docker-api"
bait_stage = "exploit-attempt"
status = 201
content_type = "application/json; charset=utf-8"
response = "{\"Id\":\"8f4d5a3c9b2e\"}"

[[rule]]
name = "kubernetes-discovery"
action = "deceive"
paths = [
  "/api/v1/nodes",
  "/api/v1/namespaces",
  "/apis/apps/v1/deployments"
]
methods = ["GET", "HEAD"]
category = "container-admin-discovery"
bait_id = "kubernetes-api"
bait_stage = "discovered"
status = 200
content_type = "application/json; charset=utf-8"
response = "{\"kind\":\"List\",\"apiVersion\":\"v1\",\"metadata\":{},\"items\":[]}"

[[rule]]
name = "kubernetes-secrets"
action = "tarpit"
regex = ["^/api/v1/namespaces/[^/]+/(secrets|serviceaccounts)(/|$)"]
category = "credential-discovery"
bait_id = "kubernetes-api"
bait_stage = "interacted"
status = 200
content_type = "application/json; charset=utf-8"
response = "{\"kind\":\"SecretList\",\"apiVersion\":\"v1\",\"metadata\":{},\"items\":[]}"

[[rule]]
name = "kubernetes-pod-exec"
action = "tarpit"
regex = ["^/api/v1/namespaces/[^/]+/pods/[^/]+/(exec|attach|portforward)(/|$)"]
category = "container-rce-probe"
bait_id = "kubernetes-api"
bait_stage = "exploit-attempt"
status = 400
content_type = "application/json; charset=utf-8"
response = "{\"kind\":\"Status\",\"apiVersion\":\"v1\",\"status\":\"Failure\",\"reason\":\"BadRequest\"}"

[[rule]]
name = "kubernetes-local-credentials"
action = "tarpit"
paths = ["/.kube/config", "/var/run/secrets/kubernetes.io/serviceaccount/token"]
category = "credential-discovery"
status = 403
content_type = "text/plain; charset=utf-8"
response = "Forbidden"
