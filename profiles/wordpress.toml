[[rule]]
name = "wordpress-install"
action = "tarpit"
paths = ["/wp-admin/install.php", "/wp-admin/setup-config.php"]
category = "wordpress-install"
status = 200
content_type = "text/html; charset=utf-8"
response = """<!doctype html><html><head><meta charset="UTF-8"><title>WordPress › Installation</title></head><body><h1>Welcome to WordPress</h1><p>Before getting started, we need some information on the database.</p></body></html>"""

[[rule]]
name = "wordpress-login"
action = "tarpit"
paths = ["/wp-login.php"]
category = "wordpress-login"
status = 200
content_type = "text/html; charset=utf-8"
response = """<!doctype html><html><head><meta charset="UTF-8"><title>Log In ‹ WordPress</title></head><body class="login"><div id="login"><h1><a href="https://wordpress.org/">Powered by WordPress</a></h1><form method="post"><p><label>Username or Email Address<br><input name="log" type="text"></label></p><p><label>Password<br><input name="pwd" type="password"></label></p><p><button type="submit">Log In</button></p></form></div></body></html>"""

[[rule]]
name = "wordpress-xmlrpc"
action = "tarpit"
paths = ["/xmlrpc.php"]
category = "wordpress-xmlrpc"
status = 200
content_type = "text/xml; charset=utf-8"
response = "<?xml version=\"1.0\"?><methodResponse><params></params></methodResponse>"

[[rule]]
name = "wordpress-rest-api"
action = "deceive"
paths = ["/wp-json", "/wp-json/"]
category = "wordpress-enumeration"
status = 200
content_type = "application/json; charset=utf-8"
response = """{"name":"Monkey Head Brewing","description":"","url":"https://www.monkeyheadbrewing.com","home":"https://www.monkeyheadbrewing.com","namespaces":["oembed/1.0","wp/v2","contact-form-7/v1"],"authentication":{}}"""

[[rule]]
name = "wordpress-rest-users"
action = "deceive"
paths = ["/wp-json/wp/v2/users", "/wp-json/wp/v2/users/"]
category = "wordpress-user-enumeration"
status = 200
content_type = "application/json; charset=utf-8"
response = "[]"

[[rule]]
name = "wordpress-rest-posts"
action = "deceive"
paths = ["/wp-json/wp/v2/posts", "/wp-json/wp/v2/posts/"]
category = "wordpress-enumeration"
status = 200
content_type = "application/json; charset=utf-8"
response = "[]"

[[rule]]
name = "wordpress-readme"
action = "deceive"
paths = ["/readme.html"]
category = "wordpress-enumeration"
status = 200
content_type = "text/html; charset=utf-8"
response = "WordPress"

[[rule]]
name = "wordpress-theme-style"
action = "deceive"
paths = ["/wp-content/themes/twentytwentythree/style.css"]
category = "wordpress-theme-enumeration"
status = 200
content_type = "text/css; charset=utf-8"
response = "/* Theme Name: Twenty Twenty-Three */"

[[rule]]
name = "wordpress-sitemap"
action = "deceive"
paths = ["/wp-sitemap.xml"]
category = "wordpress-enumeration"
status = 200
content_type = "application/xml; charset=utf-8"
response = "<?xml version=\"1.0\"?><sitemapindex/>"

[[rule]]
name = "wordpress-feed"
action = "deceive"
paths = ["/feed/", "/feed"]
category = "wordpress-enumeration"
status = 200
content_type = "application/rss+xml; charset=utf-8"
response = "<?xml version=\"1.0\"?><rss version=\"2.0\"></rss>"

[[rule]]
name = "wordpress-author-enum"
action = "deceive"
regex = ["^/\\?author=1$"]
category = "wordpress-user-enumeration"
status = 200
content_type = "text/html; charset=utf-8"
response = "admin"

[[rule]]
name = "wordpress-wlw-manifest"
action = "deceive"
paths = ["/wp-includes/wlwmanifest.xml"]
category = "wordpress-enumeration"
status = 200
content_type = "text/xml; charset=utf-8"
response = """<?xml version="1.0" encoding="UTF-8"?><manifest xmlns="http://schemas.microsoft.com/wlw/manifest/weblog"><options><clientType>WordPress</clientType><supportsKeywords>Yes</supportsKeywords></options></manifest>"""

[[rule]]
name = "wordpress-canary"
action = "tarpit"
paths = ["/wp-content/uploads/.cache/wp-maintenance.json"]
category = "wordpress-canary-followup"
status = 200
content_type = "application/json; charset=utf-8"
response = "{}"

# Deliberate vulnerability lures. These responses advertise old plugin versions only;
# Hotpot never executes plugin code and never stores submitted request bodies.
[[rule]]
name = "wordpress-bait-file-manager-readme"
action = "deceive"
paths = ["/wp-content/plugins/wp-file-manager/readme.txt"]
category = "wordpress-vulnerability-bait"
status = 200
content_type = "text/plain; charset=utf-8"
response = """=== File Manager ===
Contributors: mndpsingh287
Stable tag: 6.8
Requires at least: 4.0
Tested up to: 5.4

File Manager for WordPress.
"""

[[rule]]
name = "wordpress-bait-contact-form-7-readme"
action = "deceive"
paths = ["/wp-content/plugins/contact-form-7/readme.txt"]
category = "wordpress-vulnerability-bait"
status = 200
content_type = "text/plain; charset=utf-8"
response = """=== Contact Form 7 ===
Contributors: takayukister
Stable tag: 5.3.1
Requires at least: 5.4
Tested up to: 5.6

Contact Form 7 can manage multiple contact forms.
"""

[[rule]]
name = "wordpress-bait-file-manager-followup"
action = "tarpit"
path_prefixes = ["/wp-content/plugins/wp-file-manager/lib/php/"]
category = "wordpress-bait-followup"
status = 200
content_type = "application/json; charset=utf-8"
response = "{\"added\":[],\"removed\":[],\"changed\":[]}"

[[rule]]
name = "wordpress-bait-contact-form-7-followup"
action = "tarpit"
path_prefixes = ["/wp-json/contact-form-7/"]
category = "wordpress-bait-followup"
status = 200
content_type = "application/json; charset=utf-8"
response = "{\"status\":\"mail_sent\",\"message\":\"Thank you for your message.\"}"

[[rule]]
name = "wordpress-plugin-enumeration"
action = "deceive"
regex = ["^/wp-content/plugins/[^/]+/(?:readme\\.txt|changelog\\.txt)$"]
category = "wordpress-plugin-enumeration"
status = 404
content_type = "text/plain; charset=utf-8"
response = "Not Found"

[[rule]]
name = "wordpress-tree"
action = "deceive"
path_prefixes = ["/wp-admin/", "/wp-content/", "/wp-includes/", "/wp-json/"]
category = "wordpress-enumeration"
status = 404
response = "Not Found"
