# Password Strength Lab-specific backend discovery traps.
# Legitimate Password Lab routes are static and pass through Hotpot unchanged.

[[rule]]
name = "password-lab-admin-api"
action = "deceive"
paths = ["/api/admin", "/api/config", "/api/debug", "/api/export"]
category = "password-lab-backend-probe"
status = 404
response = "Not Found"

[[rule]]
name = "password-lab-internal-api"
action = "tarpit"
prefixes = ["/api/internal/", "/internal/"]
category = "password-lab-internal-probe"
status = 404
response = "Not Found"
