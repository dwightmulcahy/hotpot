# QNAP / Container Station example
#
# This layout is for an existing QNAP host where:
#   - cloudflared already runs with network_mode: host
#   - protected applications already listen on host ports
#   - Hotpot should be inserted between cloudflared and those existing ports
#
# Add one hotpot-<instance-id> service per protected application. The two
# services below are examples only; rename them and change ports/upstreams to
# match your deployment.
#
# Unlike compose.cloudflare.example.yml, this does not create Docker bridge
# networks or move the protected applications into this Compose project.
#
# QNAP notes:
#   - Use absolute bind-mount/env-file paths. Container Station may stage Compose
#     files under /tmp, which can make relative paths resolve somewhere unexpected.
#   - user: "1000:100" matches one common QNAP ownership setup. Change or remove
#     it if your persistent directories use different ownership.
#   - This file intentionally avoids top-level x-* extension/anchor blocks because
#     some Container Station validators reject otherwise-valid Compose extensions.
#   - Keep Hotpot listeners on 127.0.0.1 when cloudflared reaches them locally.
#   - Set HOTPOT_IMAGE_TAG to an immutable release tag for production deployments.
#     `latest` remains the fallback only so the example is easy to start.
#   - Third-party infrastructure images below are pinned by version and manifest
#     digest so an upstream tag move cannot silently replace a tested image.

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.1@sha256:188bb03589a32affed3cf4d0590565ffe67b78866e6b5582574afab2b705bafe
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  hotpot-app-one:
    image: dwightmulcahy/hotpot:${HOTPOT_IMAGE_TAG:-latest}
    container_name: hotpot-app-one
    restart: unless-stopped
    network_mode: host
    user: "1000:100"
    env_file:
      - /share/Data/config/cloudflared/hotpot.env
    environment:
      HOTPOT_INSTANCE_ID: app-one
      HOTPOT_INSTANCE_NAME: Example App One
      HOTPOT_PORT: "18081"
      HOTPOT_UPSTREAM: "http://127.0.0.1:8081"
    volumes:
      - /share/Data/config/cloudflared/hotpot-data/app-one:/data
      - /share/Data/config/cloudflared/secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  hotpot-app-two:
    image: dwightmulcahy/hotpot:${HOTPOT_IMAGE_TAG:-latest}
    container_name: hotpot-app-two
    restart: unless-stopped
    network_mode: host
    user: "1000:100"
    env_file:
      - /share/Data/config/cloudflared/hotpot.env
    environment:
      HOTPOT_INSTANCE_ID: app-two
      HOTPOT_INSTANCE_NAME: Example App Two
      HOTPOT_PORT: "18082"
      HOTPOT_UPSTREAM: "http://127.0.0.1:8082"
    volumes:
      - /share/Data/config/cloudflared/hotpot-data/app-two:/data
      - /share/Data/config/cloudflared/secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Official MaxMind updater. It downloads immediately on first start and then
  # checks every GEOIPUPDATE_FREQUENCY hours. Checks with no new release do not
  # consume a database download. Keep geoipupdate.env private; it contains the
  # MaxMind license key used only for database downloads.
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
    container_name: geoipupdate
    restart: unless-stopped
    user: "1000:100"
    env_file:
      - /share/Data/config/cloudflared/geoipupdate.env
    volumes:
      - /share/Data/config/cloudflared/geoip:/usr/share/GeoIP
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  hotpot-dashboard:
    image: dwightmulcahy/hotpot-dashboard:${HOTPOT_IMAGE_TAG:-latest}
    container_name: hotpot-dashboard
    restart: unless-stopped
    network_mode: host
    user: "1000:100"
    env_file:
      - /share/Data/config/cloudflared/dashboard.env
    volumes:
      - /share/Data/config/cloudflared/hotpot-dashboard-data:/data
      - /share/Data/config/cloudflared/geoip:/geoip:ro
      - /share/Data/config/cloudflared/secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

# Update Cloudflare Tunnel routes so each public hostname points to its Hotpot
# listener rather than directly to the protected application, for example:
#
#   app-one.example.com          -> http://localhost:18081
#   app-two.example.com          -> http://localhost:18082
#
# Hotpot then forwards normal traffic to the existing upstream ports above.
