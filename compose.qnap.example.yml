# QNAP / Container Station example
#
# This layout is for an existing QNAP host where:
#   - cloudflared already runs with network_mode: host
#   - protected applications already listen on host ports
#   - Hotpot should be inserted between cloudflared and those existing ports
#
# Unlike compose.cloudflare.example.yml, this does not create Docker bridge
# networks or move the protected applications into this Compose project.
#
# QNAP notes:
#   - Use absolute bind-mount/env-file paths. Container Station may stage Compose
#     files under /tmp, which can make relative paths resolve somewhere unexpected.
#   - user: "1000:100" matches one common QNAP ownership setup. Change or remove
#     it if your persistent directories use different ownership.
#   - This file intentionally avoids top-level x-* extension/anchor blocks because
#     some Container Station validators reject otherwise-valid Compose extensions.
#   - Keep Hotpot listeners on 127.0.0.1 when cloudflared reaches them locally.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  hotpot-monkeyhead:
    image: dwightmulcahy/hotpot:latest
    container_name: hotpot-monkeyhead
    restart: unless-stopped
    network_mode: host
    user: "1000:100"
    env_file:
      - /share/Data/config/cloudflared/hotpot.env
    environment:
      HOTPOT_INSTANCE_ID: monkeyhead
      HOTPOT_INSTANCE_NAME: Monkey Head Brewing
      HOTPOT_PORT: "18088"
      HOTPOT_UPSTREAM: "http://127.0.0.1:8088"
    volumes:
      - /share/Data/config/cloudflared/hotpot-data/monkeyhead:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  hotpot-watersolver:
    image: dwightmulcahy/hotpot:latest
    container_name: hotpot-watersolver
    restart: unless-stopped
    network_mode: host
    user: "1000:100"
    env_file:
      - /share/Data/config/cloudflared/hotpot.env
    environment:
      HOTPOT_INSTANCE_ID: watersolver
      HOTPOT_INSTANCE_NAME: Brew Water Solver
      HOTPOT_PORT: "12120"
      HOTPOT_UPSTREAM: "http://127.0.0.1:2120"
    volumes:
      - /share/Data/config/cloudflared/hotpot-data/watersolver:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  hotpot-hvac:
    image: dwightmulcahy/hotpot:latest
    container_name: hotpot-hvac
    restart: unless-stopped
    network_mode: host
    user: "1000:100"
    env_file:
      - /share/Data/config/cloudflared/hotpot.env
    environment:
      HOTPOT_INSTANCE_ID: hvac
      HOTPOT_INSTANCE_NAME: HVAC
      HOTPOT_PORT: "18080"
      HOTPOT_UPSTREAM: "http://127.0.0.1:8080"
    volumes:
      - /share/Data/config/cloudflared/hotpot-data/hvac:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  hotpot-tapmenu:
    image: dwightmulcahy/hotpot:latest
    container_name: hotpot-tapmenu
    restart: unless-stopped
    network_mode: host
    user: "1000:100"
    env_file:
      - /share/Data/config/cloudflared/hotpot.env
    environment:
      HOTPOT_INSTANCE_ID: tapmenu
      HOTPOT_INSTANCE_NAME: Tap Menu
      HOTPOT_PORT: "18111"
      HOTPOT_UPSTREAM: "http://127.0.0.1:8111"
    volumes:
      - /share/Data/config/cloudflared/hotpot-data/tapmenu:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Official MaxMind updater. It downloads immediately on first start and then
  # checks every GEOIPUPDATE_FREQUENCY hours. Checks with no new release do not
  # consume a database download. Keep geoipupdate.env private; it contains the
  # MaxMind license key used only for database downloads.
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:latest
    container_name: geoipupdate
    restart: unless-stopped
    env_file:
      - /share/Data/config/cloudflared/geoipupdate.env
    volumes:
      - /share/Data/config/cloudflared/geoip:/usr/share/GeoIP
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  hotpot-dashboard:
    image: dwightmulcahy/hotpot-dashboard:latest
    container_name: hotpot-dashboard
    restart: unless-stopped
    network_mode: host
    user: "1000:100"
    env_file:
      - /share/Data/config/cloudflared/dashboard.env
    volumes:
      - /share/Data/config/cloudflared/hotpot-dashboard-data:/data
      - /share/Data/config/cloudflared/geoip:/geoip:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

# With the shared hotpot.env example, update Cloudflare Tunnel routes so the
# public hostnames point to the Hotpot listener ports rather than directly to
# the applications, for example:
#
#   www.example-one.com  -> http://localhost:18088
#   www.example-two.com  -> http://localhost:12120
#
# Hotpot then forwards normal traffic to the existing upstream ports above.
