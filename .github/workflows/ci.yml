name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Shared Python lint
    uses: dwightmulcahy/repo-template/.github/workflows/reusable-python-ci.yml@d89e9db45ba77fd32d95da02620476eada9c01cd
    with:
      python-version: '3.12'
      install-command: python -m pip install --upgrade pip "ruff>=0.8" "pyflakes>=3.2"
      lint-command: |
        python -m ruff check --select F hotpot dashboard tests .github/scripts
        python -m pyflakes hotpot dashboard tests .github/scripts
      test-command: python -m compileall -q hotpot dashboard tests

  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q hotpot dashboard tests

      - name: Run all tests
        run: python -m unittest discover -s tests -v

  test-python-314:
    name: Python 3.14 tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q hotpot dashboard tests

      - name: Run all tests and reject leaked SQLite connections
        shell: bash
        run: |
          set -o pipefail
          PYTHONWARNINGS=default::ResourceWarning python -X tracemalloc=10 -m unittest discover -s tests -v 2>&1 | tee /tmp/hotpot-tests.log
          if grep -q "ResourceWarning: unclosed database" /tmp/hotpot-tests.log; then
            echo "Detected an unclosed sqlite3.Connection under Python 3.14"
            exit 1
          fi

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Hotpot image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: hotpot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          tags: hotpot-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
