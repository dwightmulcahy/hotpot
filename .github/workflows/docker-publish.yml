name: Publish Docker images and GitHub release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      publish_major: ${{ steps.aliases.outputs.major }}
      publish_minor: ${{ steps.aliases.outputs.minor }}
      publish_latest: ${{ steps.aliases.outputs.latest }}
      build_date: ${{ steps.build-metadata.outputs.build_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve build metadata
        id: build-metadata
        shell: bash
        run: echo "build_date=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Require vM.m.p semantic version tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vM.m.p (for example v1.2.3)."
            exit 1
          fi

      - name: Select independent stable aliases
        id: aliases
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          current="${GITHUB_REF_NAME#v}"
          major="${current%%.*}"
          minor="${current%.*}"
          stable_tags="$(git tag --list | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
          for scope in major minor latest; do
            case "$scope" in
              major) candidates="$(printf '%s\n' "$stable_tags" | awk -F. -v m="$major" '$1==m')" ;;
              minor) candidates="$(printf '%s\n' "$stable_tags" | awk -F. -v m="$major" -v n="${minor#*.}" '$1==m && $2==n')" ;;
              latest) candidates="$stable_tags" ;;
            esac
            highest="$(printf '%s\n' "$candidates" | sed '/^$/d' | sort -V | tail -n 1)"
            if [[ "$current" == "$highest" ]]; then
              echo "$scope=true" >> "$GITHUB_OUTPUT"
            else
              echo "$scope=false" >> "$GITHUB_OUTPUT"
            fi
          done

  ci:
    name: Verify release candidate
    needs: validate-tag
    uses: ./.github/workflows/ci.yml


  publish:
    name: Publish Hotpot image
    needs: [ci, validate-tag]
    uses: dwightmulcahy/repo-template/.github/workflows/reusable-docker-publish.yml@0ecc636387ef04b46acf232b3a9ef49cc2980eca
    with:
      image: dwightmulcahy/hotpot
      tag: ${{ github.ref_name }}
      publish_major: ${{ needs.validate-tag.outputs.publish_major == 'true' }}
      publish_minor: ${{ needs.validate-tag.outputs.publish_minor == 'true' }}
      publish_latest: ${{ needs.validate-tag.outputs.publish_latest == 'true' }}
      build_args: |
        HOTPOT_VERSION=${{ github.ref_name }}
        HOTPOT_GIT_SHA=${{ github.sha }}
        HOTPOT_BUILD_DATE=${{ needs.validate-tag.outputs.build_date }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-dashboard:
    name: Publish Hotpot dashboard
    needs: [ci, validate-tag]
    uses: dwightmulcahy/repo-template/.github/workflows/reusable-docker-publish.yml@0ecc636387ef04b46acf232b3a9ef49cc2980eca
    with:
      image: dwightmulcahy/hotpot-dashboard
      dockerfile: Dockerfile.dashboard
      tag: ${{ github.ref_name }}
      publish_major: ${{ needs.validate-tag.outputs.publish_major == 'true' }}
      publish_minor: ${{ needs.validate-tag.outputs.publish_minor == 'true' }}
      publish_latest: ${{ needs.validate-tag.outputs.publish_latest == 'true' }}
      build_args: |
        HOTPOT_VERSION=${{ github.ref_name }}
        HOTPOT_GIT_SHA=${{ github.sha }}
        HOTPOT_BUILD_DATE=${{ needs.validate-tag.outputs.build_date }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    name: Create GitHub release
    needs: [publish, publish-dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate conventional release notes
        uses: dwightmulcahy/repo-template/.github/actions/release-notes@f3dc1af2146156866574485a20ded5ac35d08a88
        with:
          tag: ${{ github.ref_name }}
          project-name: "Hotpot"
          image: "dwightmulcahy/hotpot"
          output: "RELEASE_NOTES.md"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; nothing to create."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "Hotpot ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
