name: Publish Docker images and GitHub release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Require vM.m.p semantic version tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vM.m.p (for example v1.2.3)."
            exit 1
          fi

  ci:
    name: Verify release candidate
    needs: validate-tag
    uses: ./.github/workflows/ci.yml


  publish:
    name: Publish Hotpot image
    needs: ci
    uses: dwightmulcahy/repo-template/.github/workflows/reusable-docker-publish.yml@d0730dfedd3dd9754d7bb442dbbbe567fe5b4bfd
    with:
      image: dwightmulcahy/hotpot
      tag: ${{ github.ref_name }}
      is_latest: true
      build_args: |
        HOTPOT_VERSION=${{ github.ref_name }}
        HOTPOT_GIT_SHA=${{ github.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-dashboard:
    name: Publish Hotpot dashboard
    needs: ci
    uses: dwightmulcahy/repo-template/.github/workflows/reusable-docker-publish.yml@d0730dfedd3dd9754d7bb442dbbbe567fe5b4bfd
    with:
      image: dwightmulcahy/hotpot-dashboard
      dockerfile: Dockerfile.dashboard
      tag: ${{ github.ref_name }}
      is_latest: true
      build_args: |
        HOTPOT_VERSION=${{ github.ref_name }}
        HOTPOT_GIT_SHA=${{ github.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    name: Create GitHub release
    needs: [publish, publish-dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate conventional release notes
        uses: dwightmulcahy/repo-template/.github/actions/release-notes@f3dc1af2146156866574485a20ded5ac35d08a88
        with:
          tag: ${{ github.ref_name }}
          project-name: "Hotpot"
          image: "dwightmulcahy/hotpot"
          output: "RELEASE_NOTES.md"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Hotpot ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
